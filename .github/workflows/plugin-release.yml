name: Release DBX plugin

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    uses: t8y2/dbx/.github/workflows/plugin-release-reusable.yml@b160d130560f71c5c429be15cec6147f677a4b3a
    with:
      release-tag: ${{ github.event.release.tag_name }}
      package-command: npm ci && npm run build && dbx-plugin package .
      package-path: dist/*.dbxp
      metadata-path: dist/*.artifact.json
      plugin-cli-version: 0.1.2
      go-version: ""
      rust-toolchain: ""
      build-matrix: '{"include":[{"runner":"ubuntu-24.04","target":"universal"}]}'
